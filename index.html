<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dynamic Snake and Ladder - 2 Player Edition</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { 
      font-family: 'Inter', sans-serif; 
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
    }
    .cell-number { font-size: 0.6rem; }
    @media (min-width: 640px) {
      .cell-number { font-size: 0.75rem; }
    }
    .token-bounce {
      animation: bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes bounce {
      0% { transform: scale(0.6) translateY(-8px); }
      70% { transform: scale(1.15) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }
    .dice-rolling {
      animation: shake 0.35s ease-in-out infinite;
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-12deg) scale(1.08); }
      75% { transform: rotate(12deg) scale(0.95); }
    }
    .dice-outcome-pop {
      animation: dicePop 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.75), 0 0 24px rgba(251, 191, 36, 0.55);
    }
    @keyframes dicePop {
      0% { transform: scale(0.85); }
      45% { transform: scale(1.32); }
      75% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .snake-hiss {
      transform-box: fill-box;
      transform-origin: center;
      animation: hissThreat 0.42s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.9)) drop-shadow(0 0 18px rgba(251, 191, 36, 0.5));
    }
    @keyframes hissThreat {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.08) rotate(-2deg); }
      50% { transform: scale(1.12) rotate(2deg); }
      75% { transform: scale(1.06) rotate(-1deg); }
    }
    .tongue-flick {
      transform-box: fill-box;
      transform-origin: center;
      animation: tongueFlickAnim 0.35s ease-in-out infinite;
    }
    @keyframes tongueFlickAnim {
      0%, 100% { opacity: 0.4; transform: scaleX(0.7); }
      50% { opacity: 1; transform: scaleX(1.25); }
    }
    .pulse-glow-ladder {
      filter: drop-shadow(0 0 10px #34d399) drop-shadow(0 0 20px #10b981);
      animation: ladderPulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes ladderPulse {
      from { opacity: 0.8; stroke-width: 14; }
      to { opacity: 1; stroke-width: 18; }
    }
    .pulse-glow-snake {
      filter: drop-shadow(0 0 10px #f43f5e) drop-shadow(0 0 22px #e11d48);
      animation: snakePulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes snakePulse {
      from { opacity: 0.8; stroke-width: 14; }
      to { opacity: 1; stroke-width: 20; }
    }
    .slither-slide {
      animation: slitherMotion 0.9s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }
    @keyframes slitherMotion {
      0% { transform: translate(0, 0) scale(1.2) rotate(0deg); }
      25% { transform: translate(-8px, -4px) scale(1.25) rotate(-15deg); }
      50% { transform: translate(8px, 4px) scale(1.2) rotate(15deg); }
      75% { transform: translate(-6px, 2px) scale(1.15) rotate(-8deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    }
    .climb-leap {
      animation: climbMotion 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes climbMotion {
      0% { transform: scale(1); }
      30% { transform: scale(1.4) translateY(-8px); }
      70% { transform: scale(1.3) translateY(-4px); }
      100% { transform: scale(1) translateY(0); }
    }
    .cell-hit-snake {
      animation: cellBite 0.5s ease-in-out 2;
    }
    @keyframes cellBite {
      0%, 100% { background-color: rgba(244, 63, 94, 0.2); transform: scale(1); }
      50% { background-color: rgba(244, 63, 94, 0.7); transform: scale(1.08); }
    }
    .cell-hit-ladder {
      animation: cellClimb 0.5s ease-in-out 2;
    }
    @keyframes cellClimb {
      0%, 100% { background-color: rgba(16, 185, 129, 0.2); transform: scale(1); }
      50% { background-color: rgba(16, 185, 129, 0.7); transform: scale(1.08); }
    }
    .active-turn-ring {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1), 0 0 16px rgba(245, 158, 11, 0.4);
    }
    .active-turn-ring-p2 {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1), 0 0 16px rgba(6, 182, 212, 0.4);
    }
    .responsive-board-wrapper {
      width: min(94vw, 48dvh);
      height: min(94vw, 48dvh);
    }
    @media (min-width: 1024px) {
      .responsive-board-wrapper {
        width: 440px;
        height: 440px;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-[100dvh] w-screen flex flex-col items-center justify-between p-2 overflow-hidden">
  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between gap-1 pb-1.5 border-b border-slate-800 shrink-0">
    <div>
      <h1 class="text-base sm:text-xl font-bold bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent leading-tight">
        Dynamic Snake &amp; Ladder
      </h1>
      <p class="text-[9px] sm:text-xs text-slate-400">Step 3 — 2-Player Turn-Based Mode</p>
    </div>
    <div class="flex items-center gap-1 flex-wrap justify-end">
      <div class="inline-flex rounded-lg bg-slate-800 p-0.5 border border-slate-700 text-[10px]">
        <button id="modePvpBtn" class="px-1.5 py-0.5 rounded-md font-medium transition bg-indigo-600 text-white">
          👥 2P
        </button>
        <button id="modeAiBtn" class="px-1.5 py-0.5 rounded-md font-medium transition text-slate-400 hover:text-white">
          🤖 AI
        </button>
      </div>

      <button id="soundToggle" class="px-1.5 py-0.5 rounded-lg bg-slate-800 text-[10px] text-slate-300 border border-slate-700 flex items-center gap-0.5">
        <span id="soundIcon">🔊</span>
      </button>
      <button id="randomizeBtn" class="px-1.5 py-0.5 rounded-lg bg-indigo-600 text-[10px] font-semibold text-white shadow">
        🎲 Swap
      </button>
      <button id="resetBtn" class="px-1.5 py-0.5 rounded-lg bg-slate-800 text-[10px] text-slate-300 border border-slate-700">
        Reset
      </button>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-2 items-center flex-1 min-h-0 py-1">
    <!-- Board Container -->
    <div class="lg:col-span-8 flex flex-col items-center justify-center shrink-0">
      <!-- Turn Banner -->
      <div id="turnBanner" class="responsive-board-wrapper !h-auto mb-1 px-2 py-0.5 rounded-lg border flex items-center justify-between text-[10px] sm:text-xs font-semibold bg-amber-950/40 border-amber-500/50 text-amber-200 shrink-0">
        <div class="flex items-center gap-1.5">
          <span id="turnPawnIcon" class="w-3.5 h-3.5 rounded-full bg-amber-400 text-slate-950 text-[9px] font-black inline-flex items-center justify-center">1</span>
          <span id="turnBannerText">P1's Turn (Amber)</span>
        </div>
        <span id="turnSubText" class="text-[9px] opacity-75 font-normal">Roll Dice</span>
      </div>

      <!-- Square Board -->
      <div id="boardContainer" class="relative responsive-board-wrapper bg-slate-950 p-1 sm:p-2 rounded-xl shadow-2xl border border-slate-800/80 select-none flex items-center justify-center shrink-0">
        <!-- 10x10 Grid -->
        <div id="board" class="grid grid-cols-10 grid-rows-10 gap-0.5 w-full h-full rounded-lg overflow-hidden bg-slate-900 p
